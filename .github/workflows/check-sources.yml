name: 公式資料の更新チェック

on:
  schedule:
    # 毎日 7:00 (JST) = 前日 22:00 (UTC)
    # 公開前で情報の動きが速いため毎日走らせている。
    # 落ち着いたら週1（例: "0 22 * * 0"）に戻してよい。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pypdf

      - name: 公式資料と報道を確認する
        id: check
        run: |
          if python scripts/check_sources.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 変化があったときは、記録（snapshots と lock）だけを main に反映し、
      # 内容を Issue で知らせる。ページ本文（index.html）には触れない。
      # 何をどう直すかは、Issue を読んだ人が判断する。
      - name: 記録を更新して Issue で知らせる
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          # 通知用に、確認前のレポートを退避しておく
          cp update-report.md /tmp/report.md

          # 記録を「確認済み」に進める（次回は差分だけが出るようにするため）
          python scripts/check_sources.py --accept

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots sources.lock.json

          if git diff --cached --quiet; then
            echo "記録に変化はありませんでした。"
          else
            git commit -m "公式資料・報道の変化を記録 (${TODAY})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          gh issue create \
            --title "府中町の動きを検知しました (${TODAY})" \
            --body-file /tmp/report.md \
            --label "" || gh issue create \
            --title "府中町の動きを検知しました (${TODAY})" \
            --body-file /tmp/report.md

      - name: 変化がなければ結果だけ残す
        if: steps.check.outputs.changed == 'false'
        run: cat update-report.md >> "$GITHUB_STEP_SUMMARY"
